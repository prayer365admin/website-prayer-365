name: ci

on:
  pull_request:
  push:
    branches: ['release/*']

jobs:
  app:
    name: app (typecheck, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Prisma Client is GENERATED output inside node_modules — a fresh install
      # has none, so `tsc` sees an empty @prisma/client (38 errors: "has no
      # exported member 'PrismaClient'/'OrgNodeKind'/…" plus cascading implicit
      # anys). Prisma 7 no longer auto-generates on install, and `prisma generate`
      # needs no database, only the schema.
      - run: bunx prisma generate
      - run: bun run typecheck
      - run: bun run lint
      # Vitest runs ALONE: two concurrent `vitest run`s in this repo starve the
      # CPU and produce false 15s timeouts.
      - run: bun run test
      # NOTE: `bun run build` is intentionally not here. It runs
      # `prisma migrate deploy` and `next build`, which need a real database and
      # the app secrets. That check belongs to the Vercel preview deployment.

  infra:
    name: infra (cdk typecheck, tests, synth)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # The CDK Lambda bundles are built from the REPO ROOT (src/lambda/*), so
      # esbuild needs the app's dependencies too: without them `cdk synth` dies
      # with "Could not resolve bcryptjs / @prisma/client". Prisma Client is
      # generated output as well, so both steps are required here.
      - name: install app dependencies (bundled into the Lambdas)
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile
      - name: generate the Prisma client (imported by the bundles)
        working-directory: ${{ github.workspace }}
        run: bunx prisma generate
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bunx vitest run
      # Only the catatia environment is synthesized here: the client example
      # creates a VPC + NAT instance, whose AMI lookup needs credentials for that
      # account (see docs/admin/INFRA-DEPLOY.md).
      - run: bunx cdk synth -c env=catatia --quiet
      - name: fail if a secret value leaked into a template
        run: |
          if grep -rE "postgresql://|sk_live|sk_test|AWS_SECRET_ACCESS_KEY" cdk.out/*.template.json; then
            echo "::error::a secret-looking value is present in the synthesized templates"
            exit 1
          fi
