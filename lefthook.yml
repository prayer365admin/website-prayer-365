pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{js,jsx,ts,tsx,json,scss,css,md,yml,yaml}'
      run: bun prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: '*.{js,jsx,ts,tsx}'
      run: bun eslint {staged_files}
    unit-tests:
      glob: '*.{test,spec}.{js,jsx,ts,tsx}'
      run: bun vitest run {staged_files}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun typecheck
    lint:
      run: bun lint
    test:
      run: bun test
